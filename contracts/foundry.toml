[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.23"
# v2 (30.07): у liquidate() девять параметров (добавлен VaultExit под yv-вольты) и кадр
# упирался в «stack too deep». via_ir — штатное лекарство; контракт всё равно деплоится
# заново, а поведение проверяют сьют и форк-реплей.
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

# Katana mainnet fork target for tests. chainId 747474; standard EVM — the Morpho Blue
# liquidate path is byte-identical to Base/Monad (real Morpho at 0xD50F2Dff… is used on the
# fork). Set KATANA_RPC_URL to run the fork tests; they early-return green when it is unset.
[rpc_endpoints]
katana = "${KATANA_RPC_URL}"
